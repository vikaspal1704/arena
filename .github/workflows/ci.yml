name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Rust engine (fmt, clippy, tests, wasm = native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - name: Native and WebAssembly builds reach the same fingerprint
        run: |
          native=$(cargo run -q --release -p arena-engine --example fingerprint -- 42 2000)
          echo "native: $native"
          test "$native" = "seq 4181 fingerprint 8d44c209bd24be3e"
      - name: Benchmark (informational)
        run: cargo run -q --release -p arena-bench -- 2000000 | tee -a "$GITHUB_STEP_SUMMARY"

  difftest:
    name: Differential test vs the Python reference engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install git+https://github.com/vikaspal1704/mini-matching-engine
      - run: cargo build --release -p arena-difftest
      - name: 1.5 million random commands must give identical results
        run: python difftest/compare.py --seeds 1-300 --count 5000 | tee -a "$GITHUB_STEP_SUMMARY"

  bridge:
    name: Kite bridge (unit tests, parser vs official SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Runtime dependencies have no known vulnerabilities
        run: npm audit --omit=dev --audit-level=low

  web:
    name: Web app (lint, types, unit, e2e, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix ../bridge
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
